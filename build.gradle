plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.10'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ch'
version = '0.0.1-SNAPSHOT'
description = 'swaply-product'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.0.1")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    //프로메테우스에게 매트릭 (Metrics - 수치화된 코드)
    // Source: https://mvnrepository.com/artifact/io.micrometer/micrometer-registry-prometheus
    implementation "io.micrometer:micrometer-registry-prometheus"

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 자바언어에서 xml을 조절하는 poi
    // Source: https://mvnrepository.com/artifact/org.apache.poi/poi-ooxml-schemas
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    //jakarta.validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // mysql
    runtimeOnly 'com.mysql:mysql-connector-j'

    //Flyway
    implementation 'org.flywaydb:flyway-core' //Flyway
    implementation 'org.flywaydb:flyway-mysql' //Flyway MySQL N
    runtimeOnly 'com.mysql:mysql-connector-j'//JDBC 210I tH
    testRuntimeOnly "com.mysql:mysql-connector-j" // CI 수행 시 테스트에도 드라이버 포함
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
